[project]
name = "projektpythonvistula2026"
version = "0.1.0"
description = "Project for intro to data science classes (Vistula University 2026/27)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.5",
    "evaluate>=0.4.6",
    "kagglehub>=1.0.0",
    "matplotlib>=3.10.8",
    "pandas>=3.0.2",
    "scikit-learn>=1.9.0",
    "torch>=2.12.0",
    "transformers>=5.10.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.15.10",
]
