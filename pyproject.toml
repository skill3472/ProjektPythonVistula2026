[project]
name = "projektpythonvistula2026"
version = "0.1.0"
description = "Project for intro to data science classes (Vistula University 2026/27)"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.5",
    "evaluate>=0.4.6",
    "kagglehub>=1.0.0",
    "matplotlib>=3.10.8",
    "pandas>=3.0.2",
    "scikit-learn>=1.9.0",
    "torch>=2.9.1",
    "transformers>=4.40.0,<4.50.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.15.10",
]
